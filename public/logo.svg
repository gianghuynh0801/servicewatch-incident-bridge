<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sw-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f1f42"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <!-- Electric Blue Gradient -->
    <linearGradient id="sw-blue" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Emerald Pulse Gradient -->
    <linearGradient id="sw-emerald" x1="16" y1="20" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="sw-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagon Chassis -->
  <path d="M32 4L56 18V46L32 60L8 46V18L32 4Z" fill="url(#sw-bg)" stroke="url(#sw-blue)" stroke-width="2"/>
  <path d="M32 8L52 20V44L32 56L12 44V20L32 8Z" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Inner Defense Shield -->
  <path d="M32 14L45 22V34C45 42 39 47 32 50C25 47 19 42 19 34V22L32 14Z" fill="rgba(37, 99, 235, 0.15)" stroke="url(#sw-blue)" stroke-width="1.6"/>

  <!-- Realtime Heartbeat Telemetry Wave -->
  <path d="M21 33H26L29 26L33 40L36 30L39 33H43" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#sw-glow)"/>

  <!-- Status Satellite Core -->
  <circle cx="32" cy="14" r="2.5" fill="#38bdf8" filter="url(#sw-glow)"/>
</svg>
