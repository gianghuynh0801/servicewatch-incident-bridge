<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sw-bg-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Primary Bridge Arc Gradient (Orange) -->
    <linearGradient id="sw-orange-grad" x1="4" y1="8" x2="44" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Radar Pulse / Beam Gradient -->
    <linearGradient id="sw-pulse-grad" x1="12" y1="24" x2="36" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="sw-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#sw-bg-grad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5"/>

  <!-- Geometric Interlocking Bridge & Sentinel Shield -->
  <g filter="url(#sw-glow)">
    <!-- Outer Shield Contour (Geometric facet) -->
    <path d="M24 7L37 13.2V22.8C37 30.6 31.4 37.3 24 39.5C16.6 37.3 11 30.6 11 22.8V13.2L24 7Z" 
          fill="url(#sw-orange-grad)" 
          fill-opacity="0.22" 
          stroke="url(#sw-orange-grad)" 
          stroke-width="2.2" 
          stroke-linejoin="round"/>

    <!-- Interconnected Bridge Arch & Nodes -->
    <!-- Left Anchor Node -->
    <circle cx="17.5" cy="24.5" r="2.8" fill="#ffffff" stroke="url(#sw-orange-grad)" stroke-width="2"/>
    <!-- Right Anchor Node -->
    <circle cx="30.5" cy="24.5" r="2.8" fill="#ffffff" stroke="url(#sw-orange-grad)" stroke-width="2"/>
    <!-- Apex Sentinel / Radar Node -->
    <circle cx="24" cy="15" r="3.2" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/>

    <!-- Telemetry Pulse Wave connecting the bridge -->
    <path d="M17.5 24.5H20.5L22.2 19.5L25.2 29.5L27.2 24.5H30.5" 
          stroke="#ffffff" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Radar Focus Dot -->
    <circle cx="24" cy="15" r="1.3" fill="#ea580c"/>
  </g>

  <!-- Specular Rim Highlight -->
  <path d="M6 14C6 8.5 10.5 4 16 4H32C37.5 4 42 8.5 42 14" 
        stroke="rgba(255, 255, 255, 0.22)" 
        stroke-width="1" 
        stroke-linecap="round"/>
</svg>
